name: Daily AI Digest

on:
  schedule:
    # Chạy tự động lúc 07:15 sáng giờ Việt Nam mỗi ngày (00:15 UTC)
    - cron: '15 0 * * *'
  # Cho phép bấm chạy thủ công bất cứ lúc nào từ giao diện GitHub
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run AI Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tracker.py

      - name: Commit and push changes (tracker state files)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_commit.txt last_commit_mcp.txt lesson_day.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last tracked commits and lesson state" && git push)

